[project]
name = "centinela"
version = "0.1.0"
description = "Centinela — asistente de operaciones con IA privada 100 % local (DEMO / DATOS FICTICIOS)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.8",
    "pyyaml>=6",
    "sqlglot>=30",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "sqlite-vec>=0.1.6",
    "pillow>=11",
    "websockets>=13",
    "psutil>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "httpx>=0.27"]
voz = [
    "numpy>=1.26",
    "kokoro-onnx>=0.5,<1",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "huggingface_hub>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
