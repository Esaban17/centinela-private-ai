# Configuración de Centinela — demo de IA privada 100 % local.
# DEMO / DATOS FICTICIOS. Ningún valor de este archivo apunta a servicios externos.
# Cualquier clave puede sobreescribirse con variables de entorno (ver .env.example).

demo:
  banco: "Banco Atitlán (ficticio)"
  marca_demo: "DEMO / DATOS FICTICIOS"
  zona_horaria: "America/Guatemala"

rutas:
  db: "data/banco.db"
  politicas: "data/politicas"
  vectores: "data/vectores/politicas.db"
  documentos_demo: "data/documentos_demo"
  modelos_voz: "modelos"          # pesos de Whisper/Kokoro descargados en la instalación

seed:
  semilla: 20261016
  clientes: 200
  transacciones_objetivo: 5000
  dias_historia: 180
  # Fecha "de hoy" para la demo. Vacío = fecha del día en que se corre `make seed`.
  # Las herramientas usan esta fecha como "ahora", así el guion no depende del reloj.
  fecha_referencia: ""

ollama:
  url: "http://127.0.0.1:11434"
  keep_alive: -1                 # nunca descargar modelos durante la demo
  presupuesto_gb: 35             # `make warmup` avisa si los modelos cargados en Ollama pasan de aquí
  # `make ollama` (scripts/ollama_serve.sh) levanta `ollama serve` con estas variables:
  servidor:
    OLLAMA_HOST: "127.0.0.1:11434"   # solo este equipo, nunca la red
    OLLAMA_MAX_LOADED_MODELS: 4      # agente + rápido + visión + embeddings, todos a la vez
    OLLAMA_NUM_PARALLEL: 1           # una petición a la vez por modelo: menos caché KV
    OLLAMA_KEEP_ALIVE: "-1"          # ningún modelo se descarga solo
    OLLAMA_FLASH_ATTENTION: 1
    OLLAMA_KV_CACHE_TYPE: "q8_0"     # caché KV a la mitad (requiere flash attention)

# Perfil 48 GB (por defecto). Etiquetas verificadas en ollama.com el 2026-10-16.
modelos:
  agente:
    nombre: "qwen3.6:35b-a3b-q4_K_M"      # MoE 35B-A3B, tools + thinking, ~24 GB
    num_ctx: 16384
    think: false                         # medir en Fase 2; activar solo si mejora el guion
  rapido:
    nombre: "qwen3:4b-instruct-2507-q4_K_M"  # ~2.5 GB, sin modo thinking → baja latencia
    num_ctx: 4096
  vision:
    nombre: "qwen3-vl:4b-instruct"        # ~3.3 GB. Perfil 64 GB: qwen3-vl:8b-instruct
    num_ctx: 8192
  embeddings:
    nombre: "bge-m3"                      # multilingüe, ~1.2 GB, 1024 dims
  stt:
    motor: "auto"                         # auto (mlx en Apple Silicon, si no faster) | mlx | faster
    nombre: "mlx-community/whisper-large-v3-turbo"   # motor mlx (la demo)
    nombre_faster: "large-v3-turbo"       # motor faster-whisper (Linux / pruebas; «small» o «base» para ir rápido)
    idioma: "es"                          # forzado: Whisper no detecta idioma
    # Vocabulario que Whisper debe reconocer (nombres propios y siglas del guion).
    prompt_inicial: "Centinela, Banco Atitlán. Lucía Fernanda Cojtí Barrios, KYC, NOC, VKS, NSX, vCenter, ESXi, quetzales."
  tts:
    motor: "kokoro"                       # kokoro | say
    respaldo: "say"                       # say | ninguno. Automático si Kokoro falla o tarda más de voz.timeout_tts_s
    voz_kokoro: "em_alex"                 # voces es: ef_dora, em_alex, em_santa (timbre de España; ver scripts/comparar_voces.py)
    idioma_kokoro: "es-419"               # fonemizador latinoamericano (seseo). «es» = España
    velocidad_kokoro: 1.0
    archivo_kokoro: "kokoro/kokoro-v1.0.onnx"   # relativo a rutas.modelos_voz. Más liviano: kokoro/kokoro-v1.0.int8.onnx
    archivo_voces: "kokoro/voices-v1.0.bin"
    voz_say: "Paulina"                    # respaldo macOS (es-MX)
    velocidad_say: 185                    # palabras por minuto

# Alternativas probadas en el mismo presupuesto (cambiar aquí, no en el código):
#   agente plan B:  gemma4:26b-a4b-it-qat (~16 GB)  |  qwen3:30b-a3b-instruct-2507-q4_K_M (~19 GB)
#   rapido:         gemma4:e2b-it-qat (~4.3 GB)     |  qwen3.5:2b (~2.7 GB)
#   embeddings:     qwen3-embedding:0.6b            |  nomic-embed-text-v2-moe

voz:
  ffmpeg: "ffmpeg"               # decodifica el audio del navegador (brew install ffmpeg)
  max_segundos_audio: 30         # lo que exceda se recorta
  umbral_silencio_rms: 0.003     # por debajo = silencio → no se transcribe (evita «Gracias por ver el video»)
  timeout_stt_s: 15
  timeout_tts_s: 8               # por oración; si se pasa, las siguientes van con el respaldo
  # Qué se habla: «primeras_oraciones» habla mientras el LLM escribe (primera palabra antes);
  # «resumen» espera la respuesta completa y habla resumen_hablado (más corto, pero empieza después).
  modo_habla: "primeras_oraciones"
  max_oraciones_habladas: 3      # tope en modo primeras_oraciones (0 = sin tope)
  max_palabras_resumen: 45
  min_caracteres_oracion: 8      # oraciones más cortas se juntan con la siguiente
  max_caracteres_oracion: 220    # si no hay punto, se corta en una coma

mcp:
  servidor: "banco-atitlan"
  max_filas: 200                 # LIMIT forzado en consulta_sql y movimientos
  timeout_sql_ms: 2000
  # Las herramientas de escritura piden confirmación humana al cliente MCP (elicitation).
  # Si el cliente no soporta elicitation, la escritura se rechaza.
  escritura_requiere_confirmacion: true
  # Cómo arranca el orquestador al servidor (proceso hijo por stdio). Vacío = este Python, `-m mcp_server`.
  comando: ""
  args: []

orquestador:
  host: "127.0.0.1"              # solo local; nunca 0.0.0.0 en la demo
  puerto: 8765
  usuario: ""                    # vacío = CENTINELA_USUARIO del .env (aparece en la auditoría)
  max_iteraciones: 6             # vueltas del loop agente → herramientas → agente
  precalentar_al_arrancar: true  # carga Whisper y Kokoro al levantar la API (sin bloquearla)
  log_archivo: "salida/centinela.log"   # copia del log para `make logs` en la terminal secundaria ("" = no)
  memoria_mensajes: 40           # mensajes de la conversación que se envían al modelo
  max_caracteres_resultado: 6000 # resultado de herramienta que ve el modelo (la UI recibe el completo)
  timeouts_s:                    # por etapa; al vencer se muestra un mensaje amable
    llm: 90
    herramienta: 20
    aprobacion: 120              # tiempo para Aprobar/Rechazar; al vencer se rechaza
    intencion: 8
    resumen: 12
    vision: 60
    stt: 30
    tts: 15                      # por oración
    voz_total: 60                # toda la voz de un turno
  enrutamiento:                  # «varios modelos, cada uno para su tarea» (chips en la UI)
    clasificar_intencion: true   # modelo rápido, en paralelo con el agente (no suma latencia)
    titulo_ticket_rapido: true   # el modelo rápido titula los tickets antes de pedir aprobación
    resumen_hablado: true        # el modelo rápido resume la respuesta para la voz (si voz.modo_habla = resumen)

# Preguntas del guion: botones de atajo en la UI (teclas 1-6) y base de warmup, ensayo y medir (scripts/guion.py).
# Se corren en orden en una misma sesión (las preguntas 2-4 dependen de la 1). Ver GUION.md.
guion:
  - id: cartera
    pregunta: "Centinela, ¿cómo está la cartera de la clienta Lucía Fernanda Cojtí Barrios?"
    herramientas_esperadas: [buscar_cliente, resumen_cliente]
  - id: fraude
    pregunta: "¿Ve movimientos raros en sus cuentas este mes?"
    herramientas_esperadas: [detectar_anomalias]
  - id: ticket
    pregunta: "Abra un ticket para el equipo de fraude con esos hallazgos."
    herramientas_esperadas: [crear_ticket]
  - id: politica
    pregunta: "¿Qué dice nuestra política sobre bloqueo preventivo de tarjetas en este caso?"
    herramientas_esperadas: [buscar_politicas]
  - id: documento                # acto 4: la boleta con el titular cambiado (make documentos)
    pregunta: "Valide esta boleta de depósito contra la base del banco."
    documento_id: "demo-boleta_deposito_discrepancia.png"
    herramientas_esperadas: [validar_documento]
    respuesta_contiene: ["titular"]
  - id: noc
    pregunta: "¿Hay alertas críticas en la infraestructura?"
    herramientas_esperadas: [alertas_infraestructura]
    respuesta_contiene: ["VKS", "NSX"]

# `make ensayo`: criterios de aceptación del prompt (§11). El reporte queda en salida/ensayos/.
ensayo:
  corridas: 10
  exito_minimo: 0.9              # ≥ 90 % de éxito por pregunta del guion
  primer_audio_max_ms: 5000      # primera palabra hablada ≤ 5 s después de soltar el botón (con --voz)

rag:
  max_caracteres_fragmento: 1500   # secciones más largas se parten por párrafos
  candidatos: 12                   # fragmentos por canal (vectorial y léxico) antes de fusionar
  rrf_k: 60                        # constante de Reciprocal Rank Fusion
  lote_embeddings: 16
  timeout_embeddings_s: 10         # si vence, la búsqueda sigue solo léxica

vision:
  max_lado_px: 1600                # se reduce la imagen antes de enviarla al modelo
  clasificar: true                 # el modelo de visión decide el tipo de documento
  timeout_s: 90
  # Fuentes para dibujar los documentos demo (la primera que exista). Deben tener tildes y ñ.
  fuentes:
    - "/System/Library/Fonts/Supplemental/Arial.ttf"
    - "/Library/Fonts/Arial Unicode.ttf"
    - "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
  fuentes_negrita:
    - "/System/Library/Fonts/Supplemental/Arial Bold.ttf"
    - "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

anomalias:
  dias_base: 120                 # historia previa usada como línea base
  umbral_z: 3.0
  horario_inicio: 0              # 00:00
  horario_fin: 5                 # 05:59
  rafaga_minutos: 30
  rafaga_min_transacciones: 4

costos:
  # Precios de referencia por millón de tokens. Los fija Estuardo; vacíos por defecto.
  # El panel los muestra como «estimación referencial» frente a «Costo marginal local: Q0.00».
  moneda: "USD"
  tipo_cambio_gtq: 7.7
  precio_entrada_millon: null
  precio_salida_millon: null
  referencia: ""                 # texto opcional junto al costo, p. ej. "modelo frontier de referencia"

soberania:
  # Procesos vigilados además del orquestador y sus hijos (el servidor MCP). Coincidencia por nombre.
  procesos: ["ollama"]
  # Guardia de salida: los procesos Python de la demo bloquean cualquier conexión fuera del equipo
  # (comun/salida.py). El monitor observa; la guardia impide.
  bloquear_salida: true

ui:
  host: "127.0.0.1"
  puerto_simulador: 8766         # `make ui-sim`: la UI contra el simulador de eventos (sin modelos)
